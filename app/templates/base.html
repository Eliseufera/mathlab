<!doctype html>
<html lang="pt-BR">

  <title>{% block title %}MathLab{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav aria-label="Navegação principal" class="nav">
      <a class="brand" href="{{ url_for('main.index') }}">MathLab</a>
      <ul class="nav-links">
        <li><a href="{{ url_for('main.index') }}">Início</a></li>
        <li><a href="/questions">Questões</a></li>

    </nav>

  <main class="content">

</body>
</html>
